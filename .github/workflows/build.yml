name: Build Roo Spatial Portal XR

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean PortalArquitecto.spec
      - uses: actions/upload-artifact@v4
        with:
          name: RooSpatialPortal-Windows
          path: dist/RooSpatialPortal/

  macos:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: chmod +x build_mac.sh && ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RooSpatialPortal-macOS
          path: dist/RooSpatialPortal.dmg

